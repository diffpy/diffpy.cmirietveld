name: Tests on PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests-on-pr:
    uses: scikit-package/release-scripts/.github/workflows/_tests-on-pr.yml@v0
    with:
      project: diffpy.cmirietveld
      c_extension: false
      headless: false
      run: |
        python -m pip install git+https://github.com/diffpy/pyobjcryst.git@main --no-deps
        python -m pip install diffpy.cmistructure --no-deps
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
